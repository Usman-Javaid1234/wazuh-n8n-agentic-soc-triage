<!--
  Wazuh custom integration block for the agentic AI triage pipeline.
  Add this inside <ossec_config> in /var/ossec/etc/ossec.conf on the Wazuh manager.
  Forwards only high severity alerts (rule level 12+) to the n8n webhook.
  Replace <n8n_host> with the actual reachable address of your n8n instance.
-->
<integration>
  <name>custom-n8n-agentic</name>
  <hook_url>http://<n8n_host>:5678/webhook/agentic-alert</hook_url>
  <level>12</level>
  <alert_format>json</alert_format>
</integration>
